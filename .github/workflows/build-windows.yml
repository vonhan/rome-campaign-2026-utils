name: Test e pacchetto Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Esegui tutti i test
        run: python -m pytest

      - name: Costruisci l'eseguibile
        run: pyinstaller --clean --noconfirm --distpath build-output RomeCampaignPDF.spec

      - name: Verifica l'eseguibile e genera la guida
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE "release"
          $zip = Join-Path $env:GITHUB_WORKSPACE "RomeCampaignPDF-Windows.zip"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item build-output/RomeCampaignPDF.exe $release
          Copy-Item README.md $release
          & build-output/RomeCampaignPDF.exe --guide-only (Join-Path $release "Guida-uso.pdf")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $release "Guida-uso.pdf"))) {
            throw "La guida PDF non è stata generata."
          }
          tar.exe -a -c -f $zip -C $release .
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "Il pacchetto ZIP non è stato generato: $zip"
          }
          Get-Item -LiteralPath $zip | Format-List FullName,Length

      - name: Pubblica il pacchetto
        uses: actions/upload-artifact@v4
        with:
          name: RomeCampaignPDF-Windows
          path: RomeCampaignPDF-Windows.zip
          if-no-files-found: error
          retention-days: 30
